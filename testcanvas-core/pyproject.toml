[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "testcanvas-core"
version = "1.0.0"
description = "Core framework per l'automazione dei test"
readme = "README.md"
requires-python = ">=3.10"
keywords = ["django", "testing", "automation", "testcanvas"]
authors = [
  { name = "Maurizio Gorenszach" }
]
license = { file = "LICENSE.md" }

# Dipendenze minime richieste dal Core
dependencies = [
    "Django>=4.2",
    # Aggiungi qui eventuali altre librerie usate dal Core (es. "requests>=2.28", "celery>=5.3")
]

# Classificatori standard PyPI/Python
classifiers = [
    "Environment :: Web Environment",
    "Framework :: Django",
    "Framework :: Django :: 4.2",
    "Framework :: Django :: 5.0",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Testing",
]

[project.urls]
"Homepage" = "https://github.com/trezzano/testcanvas"
"Repository" = "https://github.com/trezzano/testcanvas.git"

# Diciamo a setuptools di includere SOLO il modulo 'testcanvas'
# ed escludere la cartella 'sandbox' dal pacchetto finale installabile
[tool.setuptools.packages.find]
where = ["."]
include = ["testcanvas*"]
exclude = ["sandbox*"]

# Assicura che file statici, template e file di migrazione dentro 'testcanvas/'
# vengano inclusi nell'archivio distribuibile (.whl / .tar.gz)
[tool.setuptools.package-data]
"testcanvas" = [
    "templates/**/*",
    "static/**/*",
    "locale/**/*",
    "migrations/*.py",
]